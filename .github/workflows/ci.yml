name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (runtime + dev)
        run: |
          python -m pip install --upgrade "pip==25.2"
          pip install "pip-tools==7.5.1"

          # 编译运行依赖（若有 requirements.in）
          if [ -f requirements.in ]; then
            pip-compile requirements.in --output-file=requirements.txt
            pip install -r requirements.txt
          fi

          # 编译开发依赖
          pip-compile requirements-dev.in --output-file=requirements-dev.txt
          pip install -r requirements-dev.txt

      - name: Run isort (import order check)
        run: |
          isort --check-only fkin_anfu/ tests/

      - name: Run black (code format check)
        run: |
          black --check fkin_anfu/ tests/

      - name: Run flake8 (code style check)
        run: |
          flake8 fkin_anfu/ tests/

      - name: Run unit tests (pytest)
        run: |
          pytest tests/ --disable-warnings
